name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - .github/workflows/**
      - '!.github/workflows/test.yml'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  RUNNER_LABEL: &runner_label ubuntu-24.04

jobs:
  changes:
    runs-on: *runner_label
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      backend-remote: ${{ steps.filter.outputs['backend-remote'] }}
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@0bc4621a3135347011ad047f9ecf449bf72ce2bd # v3.0.0
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/local-web/**'
              - 'packages/web-core/**'
              - 'packages/remote-web/**'
              - 'packages/ui/**'
              - 'shared/**'
              - 'scripts/check-i18n.sh'
              - 'scripts/check-unused-i18n-keys.mjs'
              - 'scripts/check-legacy-frontend-paths.sh'
              - 'scripts/legacy-frontend-paths-allowlist.txt'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - '.github/workflows/test.yml'
              - '.github/actions/**'
            backend:
              - 'crates/api-types/**'
              - 'crates/client-info/**'
              - 'crates/db/**'
              - 'crates/deployment/**'
              - 'crates/desktop-bridge/**'
              - 'crates/embedded-ssh/**'
              - 'crates/executors/**'
              - 'crates/git/**'
              - 'crates/git-host/**'
              - 'crates/local-deployment/**'
              - 'crates/mcp/**'
              - 'crates/preview-proxy/**'
              - 'crates/relay-client/**'
              - 'crates/relay-control/**'
              - 'crates/relay-hosts/**'
              - 'crates/relay-protocol/**'
              - 'crates/relay-tunnel-core/**'
              - 'crates/relay-types/**'
              - 'crates/relay-webrtc/**'
              - 'crates/relay-ws/**'
              - 'crates/remote-info/**'
              - 'crates/review/**'
              - 'crates/server/**'
              - 'crates/services/**'
              - 'crates/trusted-key-auth/**'
              - 'crates/utils/**'
              - 'crates/workspace-manager/**'
              - 'crates/worktree-manager/**'
              - 'crates/ws-bridge/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'shared/**'
              - 'scripts/prepare-db.js'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/test.yml'
              - '.github/actions/**'
            backend-remote:
              - 'crates/remote/**'
              - 'crates/relay-tunnel/**'
              - 'crates/relay-tunnel-core/**'
              - 'crates/ws-bridge/**'
              - 'crates/api-types/**'
              - 'crates/relay-types/**'
              - 'crates/utils/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'shared/**'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/test.yml'
              - '.github/actions/**'
            tauri:
              - 'crates/tauri-app/**'
              - 'crates/api-types/**'
              - 'crates/client-info/**'
              - 'crates/db/**'
              - 'crates/deployment/**'
              - 'crates/desktop-bridge/**'
              - 'crates/embedded-ssh/**'
              - 'crates/executors/**'
              - 'crates/git/**'
              - 'crates/git-host/**'
              - 'crates/local-deployment/**'
              - 'crates/mcp/**'
              - 'crates/preview-proxy/**'
              - 'crates/relay-client/**'
              - 'crates/relay-control/**'
              - 'crates/relay-hosts/**'
              - 'crates/relay-protocol/**'
              - 'crates/relay-tunnel-core/**'
              - 'crates/relay-types/**'
              - 'crates/relay-webrtc/**'
              - 'crates/relay-ws/**'
              - 'crates/remote-info/**'
              - 'crates/review/**'
              - 'crates/server/**'
              - 'crates/services/**'
              - 'crates/trusted-key-auth/**'
              - 'crates/utils/**'
              - 'crates/workspace-manager/**'
              - 'crates/worktree-manager/**'
              - 'crates/ws-bridge/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/test.yml'
              - '.github/actions/**'

  frontend-checks:
    needs: changes
    if: always() && (needs.changes.outputs.frontend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Test signed terminal heartbeat
        run: pnpm exec vitest run packages/remote-web/src/shared/lib/relay/ws.test.ts --no-file-parallelism --maxWorkers 1

      - name: Test workspace sidebar widths
        run: pnpm exec vitest run packages/web-core/src/pages/workspaces/workspaceSidebarWidths.test.ts --no-file-parallelism --maxWorkers 1

      - name: Test Input scheduling and navigation
        run: pnpm exec vitest run packages/web-core/src/pages/workspaces/inputsApi.test.ts packages/web-core/src/pages/workspaces/inputSchedule.test.ts packages/web-core/src/pages/workspaces/inputFlow.test.ts packages/web-core/src/pages/workspaces/inputClose.test.ts packages/web-core/src/pages/workspaces/inputBridge.test.ts packages/web-core/src/pages/workspaces/inputRichContent.test.ts --no-file-parallelism --maxWorkers 1

      - name: Run frontend checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npx concurrently \
            --kill-others-on-fail \
            --names "local:lint,local:fmt,local:build,remote:fmt,remote:build,ui:check,ui:lint,ui:fmt,core:check,core:fmt,i18n,i18n:unused,legacy" \
            --timings \
            "cd packages/local-web && npm run lint" \
            "cd packages/local-web && npm run format:check" \
            "cd packages/local-web && npm run build" \
            "cd packages/remote-web && npm run format:check" \
            "cd packages/remote-web && npm run build" \
            "cd packages/ui && npm run check" \
            "cd packages/ui && npm run lint" \
            "cd packages/ui && npm run format:check" \
            "cd packages/web-core && npm run check" \
            "cd packages/web-core && npm run format:check" \
            "GITHUB_BASE_REF=${{ github.base_ref || 'main' }} ./scripts/check-i18n.sh" \
            "node scripts/check-unused-i18n-keys.mjs" \
            "./scripts/check-legacy-frontend-paths.sh"

      - name: Retain local frontend build
        uses: actions/upload-artifact@v4
        with:
          name: local-web-dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/local-web/dist
          retention-days: 7
          if-no-files-found: error

      - name: Retain formatted Input test sources
        if: failure()
        working-directory: packages/web-core
        run: pnpm exec prettier --write src/pages/workspaces/inputClose.test.ts src/pages/workspaces/inputRichContent.test.ts

      - name: Upload formatted Input test sources
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: input-test-format-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            packages/web-core/src/pages/workspaces/inputClose.test.ts
            packages/web-core/src/pages/workspaces/inputRichContent.test.ts
          retention-days: 1
          if-no-files-found: error

  input-links-browser:
    runs-on: *runner_label
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test native Input links in an OS sandbox
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner: %s; image: %s %s\n' "${RUNNER_ENVIRONMENT:-unset}" "${ImageOS:-unset}" "${ImageVersion:-unset}"
          df -h /
          for tool in bwrap google-chrome google-chrome-stable chromium unshare systemd-run prlimit node; do
            command -v "$tool" || true
          done
          dpkg-query -W bubblewrap google-chrome-stable 2>/dev/null || true
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if ! command -v bwrap; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
          chrome_launcher=$(command -v google-chrome || command -v google-chrome-stable)
          chrome_launcher=$(readlink -f "$chrome_launcher")
          chrome_root=$(dirname "$chrome_launcher")
          printf 'Chrome launcher: %s; payload: %s/chrome\n' "$chrome_launcher" "$chrome_root"
          test -x "$chrome_root/chrome"
          fixture_root="$GITHUB_WORKSPACE"
          node_binary=$(readlink -f "$(command -v node)")
          # The private mount namespace keeps the bounded tmpfs inside this step.
          sudo /usr/bin/timeout --kill-after=5s 180s \
            /usr/bin/unshare --mount --propagation private /bin/bash -s -- \
            "$fixture_root" "$node_binary" "$chrome_root" <<'SANDBOX'
          set -euo pipefail
          source=$1
          node_binary=$2
          chrome_root=$3
          # A root-owned path avoids traversing the runner's private home after cap-drop.
          scratch=$(mktemp -d /run/input-links.XXXXXX)
          trap 'umount "$scratch"' EXIT
          mount -t tmpfs -o size=256m,nr_inodes=8192,nosuid,nodev,mode=0700 tmpfs "$scratch"
          mkdir "$scratch/fixtures" "$scratch/data"
          mkdir "$scratch/data/home" "$scratch/data/tmp" "$scratch/data/cache"
          install -m 0444 "$source/scripts/test-input-links-browser.mjs" "$scratch/fixtures/test.mjs"
          install -m 0444 "$source/crates/server/src/routes/workspaces/input-rich-content.js" "$scratch/fixtures/runtime.js"
          install -m 0444 "$source/packages/web-core/src/pages/workspaces/inputBridge.ts" "$scratch/fixtures/bridge.ts"
          install -m 0444 "$source/crates/server/src/routes/workspaces/inputs.rs" "$scratch/fixtures/inputs.rs"
          sha256sum "$scratch/fixtures/"*
          # systemd applies aggregate limits to the supervisor, Node, and Chrome.
          echo '[input-browser] scope-start'
          set +e
          /usr/bin/systemd-run --scope --quiet \
            -p MemoryMax=1G -p MemorySwapMax=0 -p TasksMax=128 -p CPUQuota=100% \
            /bin/bash -c '
              "$@"
              status=$?
              printf "[input-browser] sandbox-exit=%s\n" "$status"
              group=$(sed -n "s/^0:://p" /proc/self/cgroup)
              printf "[input-browser] cgroup=%s\n" "$group"
              for counter in memory.peak memory.events memory.events.local pids.peak pids.events cpu.stat; do
                echo "[input-browser] $counter"
                cat "/sys/fs/cgroup$group/$counter" 2>&1 || true
              done
              systemctl show "$(basename "$group")" -p MemoryPeak -p MemoryCurrent -p TasksCurrent -p Result 2>&1 || true
              exit "$status"
            ' bash \
            /usr/bin/prlimit --cpu=120:120 --fsize=16777216:16777216 \
            --nofile=512:512 --core=0:0 -- \
            /usr/bin/bwrap --unshare-all --unshare-user --die-with-parent --new-session \
            --disable-userns --cap-drop ALL --clearenv \
            --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --ro-bind "$chrome_root" /opt/google/chrome \
            --ro-bind "$node_binary" /fixture/node \
            --ro-bind "$scratch/fixtures/test.mjs" /fixture/test.mjs \
            --ro-bind "$scratch/fixtures/runtime.js" /fixture/runtime.js \
            --ro-bind "$scratch/fixtures/bridge.ts" /fixture/bridge.ts \
            --ro-bind "$scratch/fixtures/inputs.rs" /fixture/inputs.rs \
            --bind "$scratch/data" /scratch --proc /proc --dev /dev \
            --symlink /scratch/tmp /tmp \
            --remount-ro /proc --remount-ro /dev --remount-ro / \
            --setenv HOME /scratch/home --setenv TMPDIR /scratch/tmp \
            --setenv XDG_CACHE_HOME /scratch/cache --setenv PATH /usr/bin \
            --setenv INPUT_BROWSER_SANDBOX 1 --chdir /scratch \
            /fixture/node /fixture/test.mjs
          status=$?
          set -e
          printf '[input-browser] scope-exit=%s\n' "$status"
          df -h "$scratch"
          exit "$status"
          SANDBOX

  backend-schema-checks:
    needs: changes
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-schema-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}
          setup-node: 'true'
          setup-sqlx-cli: 'true'

      - name: Check generated types
        id: generated-types
        run: npm run generate-types:check

      - name: Generate types artifact after drift
        id: generate-types-artifact
        if: failure() && steps.generated-types.outcome == 'failure'
        run: npm run generate-types

      - name: Upload generated types
        if: failure() && steps.generated-types.outcome == 'failure' && steps.generate-types-artifact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: generated-types-${{ github.sha }}
          path: shared/types.ts
          if-no-files-found: error

      - name: Sqlx checks
        run: npm run prepare-db:check

  backend-remote-checks:
    needs: changes
    # Skipped on forks and on pull requests from forks.
    if: >-
      always()
      && (needs.changes.outputs['backend-remote'] == 'true' || needs.changes.result == 'skipped')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.repository.fork == false
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: backend-remote-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}
          setup-node: 'true'
          setup-sqlx-cli: 'true'

      - name: Check remote Cargo.lock is consistent
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/remote/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path crates/relay-tunnel/Cargo.toml > /dev/null

      - name: Check formatting
        run: |
          cargo fmt --all --manifest-path crates/remote/Cargo.toml -- --check
          cargo fmt --all --manifest-path crates/relay-tunnel/Cargo.toml -- --check

      - name: Run Clippy
        run: |
          cargo clippy --all-targets --manifest-path crates/remote/Cargo.toml -- -D warnings
          cargo clippy --all-targets --manifest-path crates/relay-tunnel/Cargo.toml -- -D warnings

      - name: Check generated types
        run: npm run remote:generate-types:check

      - name: Sqlx checks
        run: npm run remote:prepare-db:check

  backend-clippy:
    needs: changes
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: backend-clippy-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Run Clippy and fmt checks
        run: |
          set -x
          cargo fmt --all -- --check & pid_fmt=$!
          cargo clippy --workspace --all-targets --exclude bettercoding-tauri -- -D warnings
          wait $pid_fmt

  backend-test:
    needs: changes
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-test-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Install cargo-nextest
        uses: taiki-e/cache-cargo-install-action@34ce5120836e5f9f1508d8713d7fdea0e8facd6f # v3.0.1
        with:
          tool: cargo-nextest
          git: https://github.com/nextest-rs/nextest
          rev: 6e4a9d6f2c4964f30ff54a8cd5466f8869267daa # cargo-nextest-0.9.132

      - name: Run Cargo tests
        run: cargo nextest run --workspace --exclude bettercoding-tauri

  tauri-checks:
    needs: changes
    if: always() && (needs.changes.outputs.tauri == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: tauri-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev file pkg-config xdg-utils

      - name: Run Tauri fmt, clippy, and compile checks
        run: |
          cargo fmt --all --manifest-path crates/tauri-app/Cargo.toml -- --check
          cargo clippy --all-targets --manifest-path crates/tauri-app/Cargo.toml -- -D warnings
          cargo check -p bettercoding-tauri
